<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Night Night Studios</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #f2f0e8;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    .landing {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .content {
      transform: translateY(-3vh);
    }

    h1 {
      max-width: 720px;
      margin: 0 auto;
      font-size: clamp(2rem, 5vw, 3.9rem);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-shadow: 0 2px 14px rgba(255, 255, 255, 0.08);
    }

    .subtitle {
      margin-top: 1.6rem;
      color: #b8b5ad;
      font-size: clamp(0.7rem, 1.4vw, 0.95rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .footer-note {
      position: absolute;
      left: 50%;
      bottom: 1.2rem;
      transform: translateX(-50%);
      width: min(90%, 720px);
      color: #5f5d58;
      font-size: 0.65rem;
      line-height: 1.5;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image:
        radial-gradient(circle at 20% 30%, #ffffff 0 1px, transparent 1px),
        radial-gradient(circle at 80% 70%, #ffffff 0 1px, transparent 1px),
        radial-gradient(circle at 50% 50%, #ffffff 0 1px, transparent 1px);
      background-size: 90px 90px, 130px 130px, 170px 170px;
    }

    @media (max-width: 600px) {
      .content {
        transform: translateY(-5vh);
      }

      h1 {
        font-size: clamp(2rem, 12vw, 3rem);
      }

      .footer-note {
        font-size: 0.55rem;
      }
    }
  </style>
</head>
<body>
  <main class="landing">
    <div class="content">
      <h1>Night Night<br />Studios</h1>
      <p class="subtitle">An indie tale will soon begin.</p>
    </div>

    <p class="footer-note">
      © 2026 Night Night Studios. All rights reserved.<br />
      All stories, worlds, characters, and visual material are the intellectual property of Night Night Games.
    </p>
  </main>

  <div class="grain"></div>
</body>
</html>
